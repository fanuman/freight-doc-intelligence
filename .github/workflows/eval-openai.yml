name: Evaluation with the real model

# Manual only: Actions tab -> this workflow -> "Run workflow". It calls OpenAI, so it costs about $0.03 per run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The settings class insists on database values even though the evaluation never connects to one.
      - name: Create .env from the example file
        run: cp .env.example .env

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Generate the synthetic dataset
        run: python -m freight_intel.synth

      - name: Evaluate with the real model and apply the gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # stored in the repo settings, never in the code
        run: python -m freight_intel.evaluation --llm openai --gate eval_thresholds.json

      - name: Keep the evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-openai
          path: eval_results/
          if-no-files-found: ignore