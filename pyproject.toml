[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-intel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.2",
  "pydantic[email]>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
  # document pipeline
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "langgraph>=1.0",
  "openai>=1.40",
  "langsmith>=0.1.100",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]