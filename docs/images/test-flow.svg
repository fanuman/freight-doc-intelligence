<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How the pipeline is tested without real documents</title><desc id="d">A seeded generator creates documents and the correct answers. The pipeline processes the documents, scoring compares its output with the answers and writes a report.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">How the pipeline is tested without real documents</text><text x="30" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Fictional carriers, repeatable data, and the correct answer saved next to every document.</text><rect x="35.0" y="205.0" width="190" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="130" y="239.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Generator</text><text x="130" y="257.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">seeded, so repeatable</text><text x="130" y="272.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">synth/</text><rect x="285.0" y="128.0" width="200" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="385" y="158.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Documents</text><text x="385" y="176.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">PDF, XLSX, EML</text><text x="385" y="193.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">quotes and invoices</text><rect x="285.0" y="298.0" width="200" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="385" y="328.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">truth.json</text><text x="385" y="346.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">the correct answer</text><text x="385" y="363.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">one per case</text><rect x="540.0" y="122.0" width="220" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="650" y="158.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">The pipeline</text><text x="650" y="176.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">real LLM (gpt-4o-mini)</text><text x="650" y="193.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">or the free oracle</text><rect x="805.0" y="128.0" width="190" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="900" y="167.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Extracted results</text><text x="900" y="185.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">charges, dates, totals</text><rect x="795.0" y="295.0" width="210" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="900" y="328.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Scoring</text><text x="900" y="346.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">compare each field and</text><text x="900" y="363.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">charge with the truth</text><rect x="1055.0" y="280.0" width="190" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="1150" y="320.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Report</text><text x="1150" y="338.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">accuracy, charge F1</text><text x="1150" y="355.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">errors caught, false alarms</text><text x="1150" y="372.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">injection leaks, cost</text><path d="M225,232 L270,232 L270,170 L285,170" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M225,268 L270,268 L270,340 L285,340" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M485,170 L540,170" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M760,170 L805,170" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M900,212 L900,295" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M485,340 L795,340" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1005,340 L1055,340" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="640" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">the answer key</text><rect x="30" y="440" width="1220" height="56" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.0"/><text x="46" y="463" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">The dataset: 45 cases, 90 documents, 4 fictional carriers. Scenarios: clean, overcharge, unquoted charge, missing charge,</text><text x="46" y="483" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">currency mismatch, expired quote, rounding noise, arithmetic error. 7 invoices contain prompt-injection text.</text></svg>