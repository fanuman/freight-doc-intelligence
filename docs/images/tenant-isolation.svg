<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How a request stays inside one company's data</title><desc id="d">The client sends a token. The API verifies it and tells Postgres which tenant this is. Row-level security then returns only that tenant's rows, and returns nothing if no tenant was set.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1180" height="640" fill="#ffffff"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">How a request stays inside one company's data</text><text x="30" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4b5563" text-anchor="start">The database enforces the rule itself with row-level security, so a missing WHERE clause in app code cannot leak rows.</text><rect x="35.0" y="83.0" width="270" height="58" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="170" y="109.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Client</text><text x="170" y="127.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">browser or script</text><line x1="170" y1="142" x2="170" y2="520" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="455.0" y="83.0" width="270" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="590" y="109.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">FastAPI</text><text x="590" y="127.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">api/deps.py, db.py, security.py</text><line x1="590" y1="142" x2="590" y2="520" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="875.0" y="83.0" width="270" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="1010" y="109.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Postgres</text><text x="1010" y="127.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">connected as a normal (non-superuser) role</text><line x1="1010" y1="142" x2="1010" y2="520" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 5"/><circle cx="30" cy="195" r="13" fill="#111827"/><text x="30" y="199.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><path d="M170,195 L584,195" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="380.0" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /me   Authorization: Bearer &lt;token&gt;</text><text x="380.0" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">the token holds user id, tenant id and role</text><circle cx="30" cy="265" r="13" fill="#111827"/><text x="30" y="269.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><rect x="395.0" y="240.0" width="390" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="590" y="262.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">check signature and expiry</text><text x="590" y="280.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">a forged or expired token stops here (401)</text><circle cx="30" cy="335" r="13" fill="#111827"/><text x="30" y="339.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><path d="M590,335 L1004,335" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="800.0" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">BEGIN, then set_config('app.tenant_id', tenant id)</text><text x="800.0" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">lasts only for this transaction</text><circle cx="30" cy="405" r="13" fill="#111827"/><text x="30" y="409.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><path d="M590,405 L1004,405" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="800.0" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SELECT ... FROM users  (or documents)</text><text x="800.0" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">the query has no tenant filter of its own</text><circle cx="30" cy="475" r="13" fill="#111827"/><text x="30" y="479.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><rect x="840.0" y="450.0" width="320" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1000" y="472.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">row-level security policy</text><text x="1000" y="490.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">keeps rows where tenant_id = app.tenant_id</text><circle cx="30" cy="545" r="13" fill="#111827"/><text x="30" y="549.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><path d="M1010,545 L596,545" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="800.0" y="536" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">only this company's rows</text><text x="800.0" y="564" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">other tenants' rows are invisible, not just filtered</text><circle cx="30" cy="600" r="13" fill="#111827"/><text x="30" y="604.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text><path d="M590,600 L176,600" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="380.0" y="591" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">response</text><text x="380.0" y="619" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"></text></svg>